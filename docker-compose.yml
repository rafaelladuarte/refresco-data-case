x-airflow-common: &airflow-common
  build: .
  user: "50000:50000"
  # group_add injeta o GID do grupo dono do docker.sock no host como grupo suplementar,
  # permitindo que o processo airflow (uid 50000) use o socket sem rodar como root.
  # O GID varia entre máquinas: descubra com `stat -c '%g' /var/run/docker.sock`
  # e defina DOCKER_GID no .env.
  group_add:
    - "${DOCKER_GID:-984}"
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Credenciais vêm do .env; a sintaxe ${VAR:?} faz o compose falhar se a variável não existir.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:?defina no .env}:${AIRFLOW_DB_PASSWORD:?defina no .env}@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?defina no .env}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./logs:/opt/airflow/logs
    - ./data/raw:/opt/airflow/data/raw
    # O DockerOperator cria os containers dbt pela API do Docker. Atenção: acesso ao
    # socket equivale a acesso root no host. Montá-lo como :ro NÃO restringe a API,
    # por isso a montagem é explícita em leitura/escrita. Aceitável apenas em ambiente local.
    - /var/run/docker.sock:/var/run/docker.sock

  depends_on:
    postgres-airflow:
      condition: service_healthy

  networks:
    - uberlandia-net

services:

  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?defina no .env}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?defina no .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}", "-d", "airflow" ]
      interval: 10s
      retries: 5
    networks:
      - uberlandia-net
  postgres-gold:
    image: postgres:15
    container_name: postgres-gold
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    volumes:
      - postgres_gold_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
    networks:
      - uberlandia-net

  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?defina no .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?defina no .env}
    ports:
      - "5050:80"
    depends_on:
      postgres-gold:
        condition: service_healthy
    networks:
      - uberlandia-net

  minio:
    # A imagem oficial minio/minio deixou de ser distribuída publicamente (Docker Hub/Quay).
    # bitnamilegacy/minio é o último build público versionado; a imagem sobe o servidor
    # e o console (porta 9001) automaticamente, sem necessidade de `command`.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: minio
    environment:
      # Mesmas credenciais usadas pelos scripts do pipeline (fonte única).
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?defina no .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?defina no .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - uberlandia-net

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "Aguardando banco..."
        sleep 10

        airflow db migrate

        # $$ adia a expansão para o shell do container (variáveis vindas do env_file),
        # evitando que a senha fique gravada na configuração do container.
        : "$${AIRFLOW_ADMIN_USER:?defina no .env}" "$${AIRFLOW_ADMIN_PASSWORD:?defina no .env}"

        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@uberlandia.com || true

        echo "Airflow inicializado com sucesso."
    restart: "no"
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - uberlandia-net
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - uberlandia-net

  streamlit_app:
    build:
      context: ./streamlit
      dockerfile: Dockerfile
    container_name: streamlit_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      # Monta a pasta local ./streamlit em /app para hot-reload em desenvolvimento
      - ./streamlit:/app
    env_file:
      - .env
    environment:
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    command: streamlit run main.py
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      postgres-gold:
        condition: service_healthy
    networks:
      - uberlandia-net

volumes:
  postgres_airflow_data:
  postgres_gold_data:
  minio_data:

networks:
  uberlandia-net:
    # Nome fixo: sem isso o compose prefixa com o nome da pasta do projeto
    # (ex.: refresco-data-case_uberlandia-net), e a DAG não acharia a rede
    # se o repositório fosse clonado com outro nome.
    name: uberlandia-net
    driver: bridge
