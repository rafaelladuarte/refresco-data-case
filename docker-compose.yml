version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.0
  user: "50000:50000"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: 'wYhQ2FzX8Q7lYk7F5v8zK0pQwGq9ZbFvYkJk9Jr2s8Q='
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.session,airflow.api.auth.backend.basic_auth'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    GOLD_DB_CONN: postgresql+psycopg2://uberlandia:senha123@postgres-gold:5432/gold
    AIRFLOW__S3__ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: minio
    AWS_SECRET_ACCESS_KEY: minio123
    AWS_DEFAULT_REGION: us-east-1

  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./logs:/opt/airflow/logs

  depends_on:
    postgres-airflow:
      condition: service_healthy

  networks:
    - uberlandia-net

services:

  # ─────────────────────────────
  # PostgreSQL Airflow metadata
  # ─────────────────────────────
  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 10s
      retries: 5
    networks:
      - uberlandia-net

  # ─────────────────────────────
  # PostgreSQL Gold (analytics)
  # ─────────────────────────────
  postgres-gold:
    image: postgres:15
    container_name: postgres-gold
    environment:
      POSTGRES_USER: uberlandia
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: gold
    volumes:
      - postgres_gold_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "uberlandia", "-d", "gold" ]
      interval: 10s
      retries: 5
    networks:
      - uberlandia-net

  # ─────────────────────────────
  # MinIO (S3 local)
  # ─────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - uberlandia-net

  # ─────────────────────────────
  # Airflow Init
  # ─────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "Aguardando banco..."
        sleep 10

        airflow db migrate

        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@uberlandia.com || true

        echo "Airflow inicializado com sucesso."
    restart: "no"

  # ─────────────────────────────
  # Webserver
  # ─────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - uberlandia-net

  # ─────────────────────────────
  # Scheduler
  # ─────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - uberlandia-net

volumes:
  postgres_airflow_data:
  postgres_gold_data:
  minio_data:

networks:
  uberlandia-net:
    driver: bridge
