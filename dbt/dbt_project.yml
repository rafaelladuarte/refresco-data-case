name: 'refresco_dbt'
version: '1.0.0'
config-version: 2

profile: 'refresco_dbt'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  refresco_dbt:
    staging:
      +materialized: view
      +schema: load_stage
    marts:
      +materialized: table
      +schema: gold

seeds:
  refresco_dbt:
    +schema: gold
