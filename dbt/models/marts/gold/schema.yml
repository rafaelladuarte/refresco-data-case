version: 2

models:
  - name: dim_tempo
    description: "Calendário diário (2020-01-01 a 2030-12-31) com clima diário de Uberlândia e agregados mensais."
    columns:
      - name: sk_tempo
        description: "Chave primária no formato YYYYMMDD (inteiro)."
        data_tests:
          - unique
          - not_null
      - name: data_completa
        description: "Data do dia correspondente."
      - name: ano
        description: "Ano (ex: 2024)."
      - name: mes
        description: "Mês (1 a 12)."
      - name: clima_temp_max
        description: "Temperatura máxima do dia (°C). NULL para dias fora do período de clima ingerido (padrão 2020–2025)."
        data_tests:
          # 4018 dias no calendário; 2192 com clima no período padrão → 1826 NULLs esperados.
          # Alerta se a cobertura cair; erro se nenhum dia tiver clima.
          - not_null:
              config:
                warn_if: ">1826"
                error_if: ">4017"
      - name: clima_precipitacao
        description: "Precipitação do dia (mm). NULL para dias fora do período de clima ingerido."
        data_tests:
          - not_null:
              config:
                warn_if: ">1826"
                error_if: ">4017"
      - name: clima_temp_max_media_mes
        description: "Média das temperaturas máximas diárias do mês (repetida em cada dia do mês)."
      - name: clima_precipitacao_total_mes
        description: "Precipitação acumulada no mês (repetida em cada dia do mês)."

  - name: dim_cliente
    description: "Dimensão de clientes utilizando SCD Tipo 1 (mantendo o registro mais atual)."
    columns:
      - name: sk_cliente
        description: "Surrogate Key (MD5 hash) gerada para o cliente."
        data_tests:
          - unique
          - not_null
      - name: id_cliente
        description: "Chave natural vinda da origem."
        data_tests:
          - not_null
      - name: canal
        description: "Canal do cliente. Ausente na origem → 'Não informado' (membro desconhecido)."
        data_tests:
          - not_null
          - accepted_values:
              values: ['Atacado', 'Conveniência', 'Food Service', 'Supermercado', 'Varejo Tradicional', 'Não informado']
      - name: uf
        description: "UF do cliente."
        data_tests:
          - accepted_values:
              values: ['MG']
      - name: regiao
        description: "Região intermediária de Minas Gerais do cliente."
        data_tests:
          - accepted_values:
              values: ['Alto Paranaíba', 'Noroeste de Minas', 'Sul de Minas', 'Triângulo Mineiro']

  - name: dim_produto
    description: "Dimensão de produtos utilizando SCD Tipo 1."
    columns:
      - name: sk_produto
        description: "Surrogate Key (MD5 hash) gerada para o produto."
        data_tests:
          - unique
          - not_null
      - name: id_produto
        description: "Chave natural vinda da origem."
        data_tests:
          - not_null
      - name: familia
        description: "Família do produto."
        data_tests:
          - accepted_values:
              values: ['ÁGUA', 'ÁGUA DE COCO', 'BEBIDA VEGETAL', 'ENERGÉTICO', 'ISOTÔNICO', 'REFRIGERANTE', 'SUCO']
      - name: custo_unitario
        description: "Custo unitário. NULL quando a origem traz custo <= 0 ou ausente (ver custo_disponivel)."
      - name: custo_disponivel
        description: "False quando o custo da origem é <= 0 ou ausente: o produto fica fora do cálculo de margem (DQ-09)."
        data_tests:
          - not_null
      - name: preco_disponivel
        description: "False quando o preço de tabela da origem é <= 0 ou ausente (preco_tabela fica NULL)."
        data_tests:
          - not_null
    data_tests:
      # A flag e o valor precisam concordar: custo disponível é sempre positivo, indisponível é sempre NULL
      - dbt_utils.expression_is_true:
          name: dim_produto_custo_coerente_com_flag
          expression: "(custo_disponivel and custo_unitario > 0) or (not custo_disponivel and custo_unitario is null)"
      - dbt_utils.expression_is_true:
          name: dim_produto_preco_coerente_com_flag
          expression: "(preco_disponivel and preco_tabela > 0) or (not preco_disponivel and preco_tabela is null)"

  - name: dim_representante
    description: "Dimensão de representantes extraída das vendas (valores únicos)."
    columns:
      - name: sk_representante
        description: "Surrogate Key (MD5 hash) gerada para a combinação de representante e canal."
        data_tests:
          - unique
          - not_null
      - name: nome_representante
        description: "Nome do representante de vendas."
        data_tests:
          - not_null

  - name: fato_vendas
    description: "Tabela fato de vendas materializada como incremental."
    columns:
      - name: sk_venda
        description: "Surrogate Key gerada (MD5) da venda."
        data_tests:
          - unique
          - not_null
      - name: id_venda
        description: "Chave natural da venda, utilizada como unique_key no incremental."
        data_tests:
          - unique
          - not_null
      - name: sk_cliente
        description: "Foreign Key apontando para dim_cliente."
        data_tests:
          # Vendas com cliente inexistente são barradas na Silver (quarentena), então
          # qualquer órfão aqui é regressão e deve falhar o build.
          - not_null
          - relationships:
              to: ref('dim_cliente')
              field: sk_cliente
      - name: sk_produto
        description: "Foreign Key apontando para dim_produto."
        data_tests:
          # Mesma regra de sk_cliente: órfãos ficam na quarentena da Silver.
          - not_null
          - relationships:
              to: ref('dim_produto')
              field: sk_produto
      - name: sk_tempo
        description: "Foreign Key apontando para dim_tempo."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_tempo')
              field: sk_tempo
      - name: sk_representante
        description: "Foreign Key apontando para dim_representante."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_representante')
              field: sk_representante
      - name: tipo_lancamento
        description: "Tipo do lançamento financeiro. NULL quando a venda ainda não possui registro em stg_financeiro (comportamento esperado — venda pendente)."
        data_tests:
          # Fonte única dos tipos válidos: seed regra_tipo_lancamento. Um tipo novo sem
          # regra definida falha aqui (NULL é ignorado — venda sem lançamento).
          - relationships:
              to: ref('regra_tipo_lancamento')
              field: tipo_lancamento
      - name: status_financeiro
        description: "Status do lançamento financeiro. NULL quando a venda ainda não possui registro em stg_financeiro (comportamento esperado — venda pendente)."
        data_tests:
          - accepted_values:
              values: ['PAGO', 'PENDENTE', 'CANCELADO']
              # accepted_values ignora NULL por padrão no dbt.
      - name: entra_receita
        description: "Flag do seed regra_tipo_lancamento: a venda compõe receita. False quando não há lançamento."
        data_tests:
          - not_null
      - name: entra_volume
        description: "Flag do seed regra_tipo_lancamento: a venda compõe volume e custo. False quando não há lançamento."
        data_tests:
          - not_null
