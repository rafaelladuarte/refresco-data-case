version: 2

models:
  - name: dim_tempo
    description: "Dimensão de tempo gerada automaticamente, com dados de clima agregados por mês."
    columns:
      - name: sk_tempo
        description: "Chave primária no formato YYYYMMDD (inteiro)."
        data_tests:
          - unique
          - not_null
      - name: data_completa
        description: "Data do dia correspondente."
      - name: ano
        description: "Ano (ex: 2024)."
      - name: mes
        description: "Mês (1 a 12)."
      - name: clima_temp_max
        description: "Média da temperatura máxima do mês correspondente. NULL para datas fora do período com dados climáticos (atualmente apenas 2024)."
        data_tests:
          - not_null:
              config:
                severity: warn
                error_if: ">4018"   # falha só se 100% forem NULL (sem dados de clima algum)
                warn_if: ">3653"    # alerta se mais de 2024 estiver sem dados
      - name: clima_precipitacao
        description: "Soma da precipitação do mês correspondente. NULL para datas fora do período com dados climáticos (atualmente apenas 2024)."
        data_tests:
          - not_null:
              config:
                severity: warn
                error_if: ">4018"
                warn_if: ">3653"

  - name: dim_cliente
    description: "Dimensão de clientes utilizando SCD Tipo 1 (mantendo o registro mais atual)."
    columns:
      - name: sk_cliente
        description: "Surrogate Key (MD5 hash) gerada para o cliente."
        data_tests:
          - unique
          - not_null
      - name: id_cliente
        description: "Chave natural vinda da origem."
        data_tests:
          - not_null

  - name: dim_produto
    description: "Dimensão de produtos utilizando SCD Tipo 1."
    columns:
      - name: sk_produto
        description: "Surrogate Key (MD5 hash) gerada para o produto."
        data_tests:
          - unique
          - not_null
      - name: id_produto
        description: "Chave natural vinda da origem."
        data_tests:
          - not_null

  - name: dim_representante
    description: "Dimensão de representantes extraída das vendas (valores únicos)."
    columns:
      - name: sk_representante
        description: "Surrogate Key (MD5 hash) gerada para a combinação de representante e canal."
        data_tests:
          - unique
          - not_null
      - name: nome_representante
        description: "Nome do representante de vendas."
        data_tests:
          - not_null

  - name: fato_vendas
    description: "Tabela fato de vendas materializada como incremental."
    columns:
      - name: sk_venda
        description: "Surrogate Key gerada (MD5) da venda."
        data_tests:
          - unique
          - not_null
      - name: id_venda
        description: "Chave natural da venda, utilizada como unique_key no incremental."
        data_tests:
          - unique
          - not_null
      - name: sk_cliente
        description: "Foreign Key apontando para dim_cliente."
        data_tests:
          - not_null:
              config:
                severity: warn
                # WARN intencional: load_stage.vendas contém id_cliente orphãos
                # (ex: C0004, C0005, linha em branco) que não existem em load_stage.clientes.
                # Problema de qualidade na origem — o JOIN em fato_vendas está correto.
          - relationships:
              to: ref('dim_cliente')
              field: sk_cliente
              config:
                severity: warn
      - name: sk_produto
        description: "Foreign Key apontando para dim_produto."
        data_tests:
          - not_null:
              config:
                severity: warn
                # WARN intencional: load_stage.vendas contém id_produto orphãos
                # (ex: P099, PXXX, P000, P-01) que não existem em load_stage.produtos.
                # Problema de qualidade na origem — o JOIN em fato_vendas está correto.
          - relationships:
              to: ref('dim_produto')
              field: sk_produto
              config:
                severity: warn
      - name: sk_tempo
        description: "Foreign Key apontando para dim_tempo."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_tempo')
              field: sk_tempo
      - name: sk_representante
        description: "Foreign Key apontando para dim_representante."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_representante')
              field: sk_representante
      - name: tipo_lancamento
        description: "Tipo do lançamento financeiro. NULL quando a venda ainda não possui registro em stg_financeiro (comportamento esperado — venda pendente)."
        data_tests:
          - accepted_values:
              values: ['VENDA', 'BONIFICACAO', 'DEVOLUCAO', 'AJUSTE', 'OUTRO']
              # accepted_values ignora NULL por padrão no dbt — NULLs não são testados aqui.
              # Se um novo tipo aparecer na ingestão sem estar nessa lista, o teste falha.
      - name: status_financeiro
        description: "Status do lançamento financeiro. NULL quando a venda ainda não possui registro em stg_financeiro (comportamento esperado — venda pendente)."
        data_tests:
          - accepted_values:
              values: ['PAGO', 'PENDENTE', 'CANCELADO']
              # accepted_values ignora NULL por padrão no dbt.
